service ProjectsLocationsInstancesRemoteagentsService_v1beta {
  // Lists all RemoteAgents that are valid and compatible with a specific connector. create POST /v1beta/{parent}/remoteAgents Creates a new RemoteAgent. delete DELETE /v1beta/{name} Deletes a RemoteAgent. fetchEditableRemoteAgents GET /v1beta/{parent}/remoteAgents:fetchEditableRemoteAgents Lists all RemoteAgents that the requesting user has permissions to edit. fetchInstallationCommand GET /v1beta/{name}:fetchInstallationCommand Retrieves the specific command string required to install a RemoteAgent. fetchInstallerFile GET /v1beta/{name}:fetchInstallerFile Retrieves a download link for the RemoteAgent's installer file. fetchRedeployStatus GET /v1beta/{name}:fetchRedeployStatus Returns the redeployment status for integrations on a RemoteAgent. fetchRemoteAgentsCompatibleWithJobs GET /v1beta/{parent}/remoteAgents:fetchRemoteAgentsCompatibleWithJobs Lists all RemoteAgents compatible with executing jobs for a specific integration. fetchRemoteAgentsInformation POST /v1beta/{parent}/remoteAgents:fetchRemoteAgentsInformation Retrieves detailed information for a list of RemoteAgents. get GET /v1beta/{name} Gets a single RemoteAgent. list GET /v1beta/{parent}/remoteAgents Lists RemoteAgents. migrateConnectors POST /v1beta/{name}:migrateConnectors Migrates legacy connectors on a RemoteAgent from remote to local scheduling. patch PATCH /v1beta/{remoteAgent.name} Updates an existing RemoteAgent. redeployRemoteAgent POST /v1beta/{parent}/remoteAgents:redeployRemoteAgent Redeploys configuration from one RemoteAgent to another. sendRemoteAgentInstaller POST /v1beta/{name}:sendRemoteAgentInstaller Sends the RemoteAgent installer via email. upgradeRemoteAgent POST /v1beta/{name}:upgradeRemoteAgent Upgrades a RemoteAgent to the latest available version.
  rpc ConnectorValidRemoteAgents(ConnectorValidRemoteAgentsRequest) returns (ConnectorValidRemoteAgentsResponse) {
    option (google.api.http) = {
      get: "/v1beta/{parent}/remoteAgents:connectorValidRemoteAgents"
    };
  }
}

