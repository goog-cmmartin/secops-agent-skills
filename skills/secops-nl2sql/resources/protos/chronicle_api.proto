service ProjectsLocationsInstancesNativedashboardsService_v1beta {
  // Add chart in a dashboard. create POST /v1beta/{parent}/nativeDashboards Create a dashboard. delete DELETE /v1beta/{name} Delete a dashboard. duplicate POST /v1beta/{name}:duplicate Duplicate a dashboard. duplicateChart POST /v1beta/{name}:duplicateChart Duplicate chart in a dashboard. editChart POST /v1beta/{name}:editChart Edit chart in a dashboard. export POST /v1beta/{parent}/nativeDashboards:export Exports the dashboards. get GET /v1beta/{name} Get a dashboard. import POST /v1beta/{parent}/nativeDashboards:import Imports the dashboards. list GET /v1beta/{parent}/nativeDashboards List all dashboards. patch PATCH /v1beta/{nativeDashboard.name} Update a dashboard. removeChart POST /v1beta/{name}:removeChart Remove chart from a dashboard.
  rpc AddChart(AddChartRequest) returns (AddChartResponse) {
    option (google.api.http) = {
      post: "/v1beta/{name}:addChart"
    };
  }
}

